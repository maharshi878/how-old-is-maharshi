<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Birthday Mode Control</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0a0a0a;
        color: #fff;
      }
      .wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .panel {
        width: 100%;
        max-width: 420px;
        background: #111;
        border: 1px solid #222;
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }
      .label {
        font-size: 14px;
        opacity: 0.6;
        margin-bottom: 8px;
      }
      h1 {
        margin: 0 0 20px 0;
        font-size: 32px;
      }
      p {
        opacity: 0.75;
        line-height: 1.5;
        margin-bottom: 20px;
      }
      input {
        width: 100%;
        padding: 14px;
        border-radius: 14px;
        border: 1px solid #2a2a2a;
        background: #0f0f0f;
        color: white;
        outline: none;
        font-size: 15px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        margin-top: 14px;
        padding: 14px;
        border-radius: 14px;
        border: none;
        background: white;
        color: black;
        font-weight: 600;
        cursor: pointer;
        font-size: 15px;
      }
      button[disabled] {
        opacity: 0.7;
        cursor: not-allowed;
      }
      .status {
        margin-top: 18px;
        padding: 14px;
        border-radius: 14px;
        background: #171717;
        border: 1px solid #252525;
        font-size: 14px;
        line-height: 1.5;
      }
      .footnote {
        margin-top: 20px;
        opacity: 0.45;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="panel">
        <div class="label">Internal Control Panel</div>
        <h1>🎂 Birthday Mode</h1>
        <p>Enable birthday mode for the next API request.</p>
        <input
          id="keyword"
          type="password"
          placeholder="Secret keyword"
        />
        <button id="toggleButton">Enable Birthday Mode</button>
        <div id="status" class="status" hidden></div>
        <div class="footnote">
          Protected via Vercel environment secret.
        </div>
      </div>
    </div>
    <script>
      const keywordInput = document.getElementById("keyword");
      const status = document.getElementById("status");
      const toggleButton =
        document.getElementById("toggleButton");

      function setStatus(message) {
        if (!message) {
          status.hidden = true;
          status.textContent = "";
          return;
        }
        status.hidden = false;
        status.textContent = message;
      }

      async function enableBirthdayMode() {
        const keyword = keywordInput.value.trim();
        if (!keyword) {
          setStatus("Enter the secret keyword");
          return;
        }

        toggleButton.disabled = true;
        toggleButton.textContent = "Enabling...";
        setStatus("Arming birthday mode...");

        try {
          const res = await fetch("/api/birthday-toggle", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ keyword }),
          });

          let data = null;
          try {
            data = await res.json();
          } catch (parseError) {
            data = null;
          }

          if (res.ok && data?.success) {
            setStatus(
              "✅ Birthday mode enabled for the NEXT request only"
            );
          } else {
            setStatus(
              data?.message || "❌ Invalid keyword"
            );
          }
        } catch (error) {
          setStatus("❌ Something went wrong");
        }

        toggleButton.disabled = false;
        toggleButton.textContent = "Enable Birthday Mode";
      }

      toggleButton.addEventListener("click", enableBirthdayMode);
      keywordInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          enableBirthdayMode();
        }
      });
    </script>
  </body>
</html>
